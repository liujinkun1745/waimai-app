# ShardingSphere 分片规则配置
dataSources:
  # 主库（写）- 库0
  ds0_master:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://localhost:3306/waimai_ds0?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  # 从库（读）- 库0
  ds0_slave:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://localhost:3307/waimai_ds0?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

  # 主库（写）- 库1
  ds1_master:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://localhost:3306/waimai_ds1?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  # 从库（读）- 库1
  ds1_slave:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://localhost:3307/waimai_ds1?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

  # 主库（写）- 库2
  ds2_master:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://localhost:3306/waimai_ds2?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  # 从库（读）- 库2
  ds2_slave:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://localhost:3307/waimai_ds2?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

  # 主库（写）- 库3
  ds3_master:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://localhost:3306/waimai_ds3?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  # 从库（读）- 库3
  ds3_slave:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://localhost:3307/waimai_ds3?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

  # 默认库（非分片表：user, merchant, category, product, review, coupon, address, balance_record）
  default_ds:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://localhost:3306/waimai?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

rules:
  # 读写分离规则
  - !READWRITE_SPLITTING
    dataSources:
      ds0_rw:
        writeDataSourceName: ds0_master
        readDataSourceNames:
          - ds0_slave
        loadBalancerName: round_robin
      ds1_rw:
        writeDataSourceName: ds1_master
        readDataSourceNames:
          - ds1_slave
        loadBalancerName: round_robin
      ds2_rw:
        writeDataSourceName: ds2_master
        readDataSourceNames:
          - ds2_slave
        loadBalancerName: round_robin
      ds3_rw:
        writeDataSourceName: ds3_master
        readDataSourceNames:
          - ds3_slave
        loadBalancerName: round_robin
    loadBalancers:
      round_robin:
        type: ROUND_ROBIN

  # 分片规则
  - !SHARDING
    tables:
      # 订单表：按 user_id 分库分表
      "order":
        actualDataNodes: ds${0..3}_rw.order_${0..1}
        databaseStrategy:
          standard:
            shardingColumn: consumer_id
            shardingAlgorithmName: order_db_inline
        tableStrategy:
          standard:
            shardingColumn: consumer_id
            shardingAlgorithmName: order_table_inline
      # 订单商品表：绑定表，与 order 表相同分片策略
      order_item:
        actualDataNodes: ds${0..3}_rw.order_item_${0..1}
        databaseStrategy:
          standard:
            shardingColumn: order_id
            shardingAlgorithmName: order_item_db_hint
        tableStrategy:
          standard:
            shardingColumn: order_id
            shardingAlgorithmName: order_item_table_hint

    # 绑定表：避免笛卡尔积 JOIN
    bindingTables:
      - "order", order_item

    # 默认数据源（非分片表）
    defaultDataSourceName: default_ds

    shardingAlgorithms:
      # 订单库分片：consumer_id % 4
      order_db_inline:
        type: INLINE
        props:
          algorithm-expression: ds${consumer_id % 4}_rw
      # 订单表分片：consumer_id % 2
      order_table_inline:
        type: INLINE
        props:
          algorithm-expression: order_${consumer_id % 2}
      # 订单商品项关联分片（按 order_id 路由到对应分片）
      order_item_db_hint:
        type: HINT
      order_item_table_hint:
        type: HINT

  # 单表规则（非分片表的默认路由）
  - !SINGLE
    tables:
      - "*.*"

props:
  sql-show: false
  sql-simple: true
